<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anywhere Web Workspace</title>
    <style>
        /* 完美复刻鸿蒙端的 Terminal/Console 美学 */
        body { 
            font-family: monospace; 
            background: #FFFFFF; 
            color: #1C1E21; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
        }
        #header { 
            display: flex; 
            align-items: center; 
            padding: 16px 24px; 
            background: #FFFFFF;
            border-bottom: 1px solid #EFEFEF; 
        }
        #header input { 
            font-family: monospace; 
            padding: 8px 12px; 
            margin-right: 12px; 
            border: 1px solid #D4D6DA; 
            border-radius: 6px;
            background: #F4F5F7;
            outline: none;
        }
        #header button { 
            font-family: monospace; 
            font-weight: bold;
            padding: 8px 20px; 
            background: #1A7F4B; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        #header button:hover { opacity: 0.9; }
        
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .msg { 
            padding: 16px 20px; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-size: 15px;
            line-height: 1.5;
        }
        .msg.user { 
            border-right: 3px solid #1A7F4B; 
            background: #FFFFFF; 
            align-self: flex-end; 
            width: 80%; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .msg.agent { 
            border-left: 3px solid #EFEFEF; 
            background: #F4F5F7; 
            align-self: flex-start; 
            width: 100%; 
        }
        
        .meta { 
            font-size: 13px; 
            color: #9CA3AB; 
            margin-bottom: 8px; 
            font-weight: bold; 
        }
        .meta.user { color: #1A7F4B; text-align: right; }
        
        .thought { 
            color: #6B717A; 
            background: #E5E7EB;
            border-radius: 6px;
            padding: 12px; 
            margin-bottom: 12px; 
            font-size: 13px;
        }
        
        #input-area { 
            display: flex; 
            gap: 12px; 
            padding: 24px; 
            background: #F4F5F7;
            border-top: 1px solid #EFEFEF;
        }
        #input-area input { 
            flex: 1; 
            font-family: monospace; 
            padding: 16px; 
            border: 1px solid #D4D6DA; 
            border-radius: 8px; 
            font-size: 15px;
            outline: none;
        }
        #input-area input:focus { border-color: #1A7F4B; }
        #input-area button { 
            font-family: monospace; 
            font-weight: bold;
            padding: 0 32px; 
            background: #1A7F4B; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px;
        }
        #input-area button:disabled { background: #9CA3AB; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="header">
        <strong style="margin-right:24px; font-size: 18px;">Anywhere Web</strong>
        <input id="ws-url" type="text" value="ws://127.0.0.1:6767" title="Server Address">
        <input id="agent-type" type="text" value="opencode" title="Agent Type">
        <button id="btn-connect">Connect</button>
        <span id="status" style="margin-left:24px; color:#D97706; font-weight: bold;">Disconnected</span>
    </div>
    
    <div id="chat">
        <!-- 初始空状态 -->
        <div style="text-align: center; margin-top: 100px; color: #9CA3AB;">
            <svg viewBox="0 0 24 24" width="64" height="64" style="margin-bottom: 16px;">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M6 9l4 3-4 3M12 15h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h2>Anywhere Web Workspace</h2>
            <p>Agent Client Protocol (ACP) Ready</p>
        </div>
    </div>
    
    <div id="input-area">
        <span style="font-weight: bold; color: #1A7F4B; font-size: 20px; align-self: center;">></span>
        <input id="msg-input" type="text" placeholder="Enter command or message..." disabled>
        <button id="btn-send" disabled>Send</button>
    </div>

    <script>
        let ws;
        let sessionId = null;
        let activeAgentMsg = null;
        let activeThoughtMsg = null;

        const btnConnect = document.getElementById('btn-connect');
        const btnSend = document.getElementById('btn-send');
        const inputMsg = document.getElementById('msg-input');
        const chat = document.getElementById('chat');
        const status = document.getElementById('status');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = `<div class="meta ${role}">${role === 'user' ? 'user@web ~$' : 'agent@remote ~$'}</div><span class="content">${text}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div.querySelector('.content');
        }

        btnConnect.onclick = () => {
            if (ws) ws.close();
            status.textContent = 'Connecting...';
            status.style.color = '#D97706';
            
            ws = new WebSocket(document.getElementById('ws-url').value);
            
            ws.onopen = () => {
                status.textContent = 'ACP Bridge Online';
                status.style.color = '#059669';
                inputMsg.disabled = false;
                btnSend.disabled = false;
                chat.innerHTML = ''; // 清空初始画面
                
                // 开始 Session
                ws.send(JSON.stringify({
                    type: 'start',
                    agent: document.getElementById('agent-type').value
                }));
            };
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                if (data.type === 'session_started') {
                    sessionId = data.sessionId;
                } 
                else if (data.type === 'agent_event') {
                    const ev = data.event;
                    if (ev.sessionUpdate === 'user_message_chunk') {
                        // ACP协议可能会回传 user message
                    } 
                    else if (ev.sessionUpdate === 'agent_thought_chunk') {
                        if (!activeThoughtMsg) {
                            const div = document.createElement('div');
                            div.className = 'msg agent';
                            div.innerHTML = `<div class="meta agent">agent@remote ~$ [thinking]</div><div class="thought"></div>`;
                            chat.appendChild(div);
                            activeThoughtMsg = div.querySelector('.thought');
                        }
                        activeThoughtMsg.textContent += ev.content.text;
                        chat.scrollTop = chat.scrollHeight;
                    }
                    else if (ev.sessionUpdate === 'agent_message_chunk') {
                        if (!activeAgentMsg) {
                            activeAgentMsg = appendMessage('agent', '');
                        }
                        activeAgentMsg.textContent += ev.content.text;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
                else if (data.type === 'turn_ended') {
                    activeAgentMsg = null;
                    activeThoughtMsg = null;
                }
            };
            
            ws.onclose = () => {
                status.textContent = 'Disconnected';
                status.style.color = '#DC2626';
                inputMsg.disabled = true;
                btnSend.disabled = true;
                sessionId = null;
            };
        };

        function sendMsg() {
            const text = inputMsg.value.trim();
            if (!text) return;
            
            // Web 端本地回显
            appendMessage('user', text);
            
            if (sessionId) {
                ws.send(JSON.stringify({
                    type: 'input',
                    sessionId: sessionId,
                    text: text
                }));
            } else {
                 ws.send(JSON.stringify({
                    type: 'start',
                    agent: document.getElementById('agent-type').value,
                    prompt: text
                }));
            }
            
            inputMsg.value = '';
        }

        btnSend.onclick = sendMsg;
        inputMsg.onkeypress = (e) => { if (e.key === 'Enter') sendMsg(); };
    </script>
</body>
</html>
